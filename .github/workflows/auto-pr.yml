name: Auto PR

on:
  push:
    branches-ignore:
      - main
      - release
      - "release-please--**"
      - "gh-readonly-queue/**"
      - "dependabot/**"

concurrency:
  group: auto-pr-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: write

jobs:
  open:
    name: Open a pull request into main
    runs-on: ubuntu-24.04
    timeout-minutes: 5

    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Open the pull request
        env:
          GH_TOKEN: ${{ secrets.AUTOMATION_TOKEN || secrets.GITHUB_TOKEN }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          BRANCH: ${{ github.ref_name }}
        run: |
          set -euo pipefail

          # Only create PRs targeting main
          BASE="main"

          # Skip if an open PR already exists for this branch
          existing_pr=$(
            gh pr list \
              --head "$BRANCH" \
              --base "$BASE" \
              --state open \
              --limit 1 \
              --json number \
              --jq '.[0].number // empty'
          )

          if [ -n "$existing_pr" ]; then
            echo "PR #$existing_pr already exists for \`$BRANCH\` — skipping." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi

          # Skip if branch has no new commits compared with base
          if [ "$(git rev-list --count "origin/$BASE..origin/$BRANCH")" -eq 0 ]; then
            echo "\`$BRANCH\` has no commits ahead of \`$BASE\` — skipping." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi

          title=$(.github/scripts/pr-title.sh generate "origin/$BASE" "origin/$BRANCH" "$BRANCH")

          body=$(cat <<EOF
          Opened automatically when \`$BRANCH\` was pushed.

          The title is generated from the diff and may be updated on later pushes.
          It is squashed into \`$BASE\`, so the PR title becomes the commit subject
          and changelog line. If you manually rename the PR, automation will stop
          updating it.

          <!-- pr-title: $title -->
          EOF
          )

          gh pr create \
            --base "$BASE" \
            --head "$BRANCH" \
            --title "$title" \
            --body "$body"

          echo "Opened PR for \`$BRANCH\` with title \`$title\`." >> "$GITHUB_STEP_SUMMARY"
